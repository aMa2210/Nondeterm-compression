defaults:
  - qwen3_14b
  - _self_

# Input Hugging Face model to compress
input_hf_model_path: OPENPIPE_SNAPSHOT_PLACEHOLDER

# Dataset path for pruning and NAS scoring
dataset_path: /home/jovyan/Tairan/Nondeterm-compression/modelopt_prune/datasets/Puzzle-KD-Nemotron-Post-Training-Dataset-v2

# Working directory for compression outputs
puzzle_dir: /home/jovyan/Tairan/Nondeterm-compression/modelopt_prune/puzzle_dir_qwen3_14b

# MIP memory constraint (in MiB) 
mip:
  human_constraints:
    target_memory: 78_000 # 78 GiB

# FFN intermediate sizes to search over (heterogeneous architecture)
# teacher_intermediate_size is 17408 (Qwen3-14B)
pruning:
  intermediate_size_list: [17152, 16384, 15616, 14848, 14080]
